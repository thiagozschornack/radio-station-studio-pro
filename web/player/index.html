<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rádio ao vivo</title>
  <meta name="theme-color" content="#0f1216">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1216'/%3E%3Cpath d='M9 22a9 9 0 0 1 14 0M12 19a5 5 0 0 1 8 0' stroke='%2319d3e6' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='23' r='2' fill='%23ff3b4e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/player/player.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div>
        <h1 id="name">Carregando…</h1>
        <p id="slogan" class="slogan"></p>
      </div>
      <span id="onair" class="onair">OFF AIR</span>
    </header>

    <section class="player" aria-label="Player ao vivo">
      <div class="art" id="art" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="72" height="72"><path d="M8 21a10 10 0 0 1 16 0M11.5 18a5.5 5.5 0 0 1 9 0" stroke="#19d3e6" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="16" cy="22.5" r="2" fill="#ff3b4e"/></svg>
      </div>
      <div class="info">
        <div class="label"><span class="eq paused" id="eq"><i></i><i></i><i></i><i></i></span> <span id="state">Pronto para ouvir</span></div>
        <div class="title" id="title">—</div>
        <div class="artist" id="artist"></div>
        <div class="ctl">
          <button id="play" class="play" aria-label="Ouvir ao vivo" disabled>
            <svg id="ic-play" viewBox="0 0 24 24" width="30" height="30"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            <svg id="ic-stop" viewBox="0 0 24 24" width="26" height="26" hidden><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          </button>
          <label class="vol"><span class="sr-only">Volume</span>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/></svg>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume">
          </label>
          <button id="share" class="btn ghost sm" type="button">Compartilhar</button>
        </div>
        <p class="fmt" id="fmt"></p>
      </div>
    </section>

    <section id="history-sec" class="history" hidden>
      <h2>Tocou recentemente</h2>
      <ol id="history"></ol>
    </section>

    <footer class="foot">
      <span id="desc"></span>
      <span>Plataforma <b>Radio Station Studio Pro</b> · EmpreenderTHZ</span>
    </footer>
  </main>
  <audio id="audio" preload="none"></audio>
  <script type="module" src="/player/player.js"></script>
</body>
</html>
